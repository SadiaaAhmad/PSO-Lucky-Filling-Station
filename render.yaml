services:
  - type: web
    name: pso-lucky-filling-station-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PROJECT_NAME
        value: "PSO Lucky Filling Station Accounting System"
      - key: API_V1_STR
        value: "/api/v1"
      - key: DATABASE_URL
        sync: false
